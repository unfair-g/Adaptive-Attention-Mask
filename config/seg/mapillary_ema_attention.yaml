# Configuration for ER+EMA+Attention Map Distillation Online Continual Semantic Segmentation
# Dataset: Mapillary Vistas mapped to Cityscapes 19 classes
# Model: SegFormer with EMA teacher and Attention Map Distillation (v3)

# Training settings
train: true
epochs: 1
batch_size: 2
learning_rate: 0.00006
weight_decay: 0.01
optim: AdamW
grad_clip: 1.0

# Model settings
segformer_variant: mit_b0
freeze_encoder: false
pretrained: true

# Dataset settings
dataset: mapillary
data_root_dir: ./data/mapillary/
img_size: [512, 1024]
n_classes: 19
ignore_index: 255
num_workers: 4
nb_channels: 3

# Continual Learning Task Configuration
training_type: inc
increment: "11-5"
class_order: sequential
label_mode: current_only

# Memory settings
mem_size: 500
mem_batch_size: 4
buffer: seg_reservoir
drop_method: random
mem_iters: 1

# EMA settings
ema_alpha: 0.9999

# Logit KD settings
alpha_kd: 3.0
kd_temperature: 3.0
eval_mode: avg
pred_confidence_threshold: 0.15

# Segmentation loss
seg_loss_type: focal
focal_alpha: 0.25
focal_gamma: 2.0
ohem_ratio: 0.25
use_current_class_balance: true
class_balance_power: 0.5
class_balance_max: 10.0

# Attention map distillation
attention_start_task: 1
attention_kd_weight: 5.0
active_attention_stages: [2, 3]
attention_stage_weights: [1.0, 1.5]
attention_loss_type: kl

# Masked attention distillation (MAD)
use_masked_distillation: true

# STU-Mask
stu_enabled: true
stu_eps: 1e-8
stu_entropy_gamma: 1.5
cosine_entropy_alpha: 1.0
stu_min_mask_value: 0.05
stu_margin_threshold: 1.2
stu_margin_space: label
stu_weight_mode: label_pixel
mad_relaxed_threshold: 0.1
stu_pool_size: 32
attention_head_aggregation: mean

# Class-balanced replay retrieval
use_balanced_sampling: true
balanced_sampling_mode: minority

# Adaptive replay
use_adaptive_replay: false
max_replay_multiplier: 3.0

# Learner
learner: ER_EMA_Attention_Seg

# Logging
tag: mapillary_ema_attention_seg
logs_root: ./logs/
results_root: ./results/
ckpt_root: ./checkpoints/
save_ckpt: true
no_wandb: true
verbose: false

# Experiment
seed: 0
n_runs: 1
